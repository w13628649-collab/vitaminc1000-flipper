<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>albion guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#dfe1e3; --surface:#eef0f1; --surface-2:#e6e8ea;
  --ink:#15181c; --ink-mid:#4a5158; --ink-soft:#7c858d;
  --rule:#c6cbcf; --rule-soft:#d6dadd;
  --bronze:#8a6320; --gain:#2c6e49; --warn:#9c3232;
  --thetford:#6b4a8f; --fort-sterling:#69737d; --lymhurst:#4f7a3a;
  --martlock:#2f5d8a; --bridgewatch:#b07226; --caerleon:#9c3232;
  --r:2px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo,system-ui,sans-serif; font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px 60px}
header{display:flex; gap:20px; align-items:baseline; padding:22px 0 14px; border-bottom:2px solid var(--ink)}
.brand{font-size:19px; font-weight:700; letter-spacing:-.02em}
.brand span{color:var(--bronze)}
.facts{display:flex; gap:22px; margin-left:auto}
.fact{display:flex; flex-direction:column; gap:1px; text-align:right}
.fact b{font-size:14px; font-weight:600; line-height:1.2}
.fact i{font-size:11px; font-style:normal; color:var(--ink-soft)}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px}
.live{background:var(--gain)} .dead{background:var(--warn)}

.note{padding:14px 0 6px; font-size:12.5px; color:var(--ink-mid); max-width:76ch}
table{width:100%; border-collapse:collapse; margin-top:10px}
th{
  text-align:right; font-size:11px; font-weight:600; color:var(--ink-soft);
  padding:7px 10px; border-bottom:1px solid var(--ink); white-space:nowrap;
}
th:first-child,th:nth-child(2){text-align:left}
td{padding:8px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--rule-soft)}
td:first-child,td:nth-child(2){text-align:left}
tr:hover{background:var(--surface)}
.city{display:flex; align-items:center; gap:6px; font-weight:500}
.cdot{width:8px; height:8px; border-radius:50%; background:var(--c)}
.price{font-weight:600; border-radius:var(--r); padding:2px 5px; margin:-2px -5px}
.depth{font-size:11.5px; color:var(--ink-soft)}
.age{font-size:11.5px; color:var(--ink-soft)}
.sell{color:var(--ink)}
.buy{color:var(--ink)}
/* 价格跳动:涨绿跌红,和整套设计语言一致 */
@keyframes up   { from{background:color-mix(in oklab,var(--gain),transparent 62%)} to{background:transparent} }
@keyframes down { from{background:color-mix(in oklab,var(--warn),transparent 62%)} to{background:transparent} }
.flash-up{animation:up .7s ease-out}
.flash-down{animation:down .7s ease-out}
@media (prefers-reduced-motion:reduce){ .flash-up,.flash-down{animation:none} }
.empty{padding:40px 0; color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">albion <span>guild</span></div>
    <div class="facts">
      <div class="fact"><b id="conn"><span class="dot dead"></span>未连接</b><i>推送通道</i></div>
      <div class="fact"><b id="clients">—</b><i>在线客户端</i></div>
      <div class="fact"><b id="ticks">0</b><i>收到的行情</i></div>
    </div>
  </header>

  <p class="note">
    价格由公会成员在游戏里翻市场时上传,服务端去重后实时推给所有在线的人。
    <b>不需要刷新页面</b>——数值变化时会自己跳动,涨绿跌红。
  </p>

  <table>
    <thead><tr>
      <th>物品</th><th>城市</th>
      <th>卖单最低</th><th>深度</th>
      <th>买单最高</th><th>深度</th>
      <th>更新</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">等待行情…先跑一下 <code>cmd/simulate</code> 灌点数据。</div>
</div>

<script>
const CITY_VAR = {
  "Thetford":"--thetford","Fort Sterling":"--fort-sterling","Lymhurst":"--lymhurst",
  "Martlock":"--martlock","Bridgewatch":"--bridgewatch","Caerleon":"--caerleon",
};
const WATCH_ITEMS  = ["T4_METALBAR","T5_METALBAR","T6_METALBAR","T5_CLOTH","T5_PLANKS"];
const WATCH_CITIES = ["Martlock","Lymhurst","Bridgewatch","Thetford"];

const keys = [];
for (const it of WATCH_ITEMS)
  for (const c of WATCH_CITIES)
    for (const side of [0, 1]) keys.push(`${it}|${c}|1|${side}`);

const state = new Map();   // "item|city|quality" -> {sell, buy, at}
let received = 0;

const $ = id => document.getElementById(id);
const num = n => n.toLocaleString();

function rowKey(k) { const p = k.split("|"); return `${p[0]}|${p[1]}|${p[2]}`; }

function render() {
  const rows = [...state.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  $("empty").style.display = rows.length ? "none" : "";
  $("rows").innerHTML = rows.map(([rk, v]) => {
    const [item, city] = rk.split("|");
    return `<tr data-rk="${rk}">
      <td>${item}</td>
      <td><span class="city"><i class="cdot" style="--c:var(${CITY_VAR[city] || "--ink-soft"})"></i>${city}</span></td>
      <td><span class="price sell" data-f="sell">${v.sell ? num(v.sell.p) : "—"}</span></td>
      <td class="depth">${v.sell ? num(v.sell.d) : ""}</td>
      <td><span class="price buy" data-f="buy">${v.buy ? num(v.buy.p) : "—"}</span></td>
      <td class="depth">${v.buy ? num(v.buy.d) : ""}</td>
      <td class="age">${v.at ? new Date(v.at).toLocaleTimeString("zh-CN") : ""}</td>
    </tr>`;
  }).join("");
}

// 只改变化的那个单元格并让它闪一下,不整表重绘
function patch(rk, field, q, dir) {
  const tr = document.querySelector(`tr[data-rk="${CSS.escape(rk)}"]`);
  if (!tr) { render(); return; }
  const el = tr.querySelector(`[data-f="${field}"]`);
  if (!el) return;
  el.textContent = num(q.p);
  // 深度在下一个 td 里,不是 span 的兄弟 —— span 是这个 td 里唯一的元素
  const depthCell = el.closest("td").nextElementSibling;
  if (depthCell) depthCell.textContent = num(q.d);
  tr.lastElementChild.textContent = new Date(q.t).toLocaleTimeString("zh-CN");
  if (dir) {
    el.classList.remove("flash-up", "flash-down");
    void el.offsetWidth;                    // 强制重排,让同一元素能连续播动画
    el.classList.add("flash-" + dir);
  }
}

function applyQuote(q) {
  const rk = rowKey(q.k);
  const side = q.k.split("|")[3] === "0" ? "sell" : "buy";
  const cur = state.get(rk) || {};
  const prev = cur[side];
  const isNew = !prev;
  const dir = prev ? (q.p > prev.p ? "up" : q.p < prev.p ? "down" : "") : "";
  cur[side] = {p: q.p, d: q.d};
  cur.at = q.t;
  state.set(rk, cur);
  if (isNew) render(); else patch(rk, side, {p: q.p, d: q.d, t: q.t}, dir);
}

let ws, backoff = 500;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = async () => {
    backoff = 500;
    $("conn").innerHTML = '<span class="dot live"></span>已连接';
    // ① 重新订阅:新连接(可能是另一个实例)完全不知道你要看什么
    ws.send(JSON.stringify({op: "sub", keys}));
    // ② 拉快照:补上断线期间错过的变化。少了这步界面会停在旧值上,
    //    却看起来"一切正常"——这是这类系统最常见的 bug
    try {
      const snap = await (await fetch("/api/quotes?keys=" + keys.join(","))).json();
      snap.forEach(applyQuote);
    } catch (e) { /* 拉不到就等推送 */ }
  };

  ws.onmessage = e => {
    received++;
    $("ticks").textContent = received;
    applyQuote(JSON.parse(e.data));
  };

  ws.onclose = () => {
    $("conn").innerHTML = '<span class="dot dead"></span>重连中…';
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30000);   // 指数退避
  };
}
connect();

setInterval(async () => {
  try {
    const s = await (await fetch("/api/stats")).json();
    $("clients").textContent = s.clients;
  } catch (e) { /* 服务端不在就先空着 */ }
}, 3000);
</script>
</body>
</html>
