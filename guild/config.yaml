# Albion 价差扫描器配置。阈值全部可调 —— 按实盘反馈改这里,不要改代码。

server: east
cities:
  - Thetford
  - Fort Sterling
  - Lymhurst
  - Martlock
  - Bridgewatch
  - Caerleon
  - Brecilien             # 迷雾里的城:同城照常算;跨城路线带 mists 风险标记,置信度最高 medium

capital: 10_000_000       # 银币
qualities: [1]            # 1 普通 / 2 良好 / 3 优秀 / 4 杰出 / 5 不凡。清单物品一律扫这几档;
                          # 抓包窗口里有挂单的别的品质会另外并进扫描(见 capture.max_extra_items)

freshness:
  max_hours: 6.0          # 超过这个时间的报价直接丢弃
  high_confidence_hours: 2.0

filters:
  deviation_min: 0.4      # 价格 / 7 日均价 的合理区间,区间外视为 troll 挂单
  deviation_max: 2.5
  min_daily_volume_silver: 500_000
  reject_crossed_book: true
  max_history_gap_days: 3
  min_days_with_data_7d: 3
  max_margin: 1.0         # 毛利率 > 100% 基本是两边同时挂了 troll 单
  # ↓ 深度判据:只对来自自建抓包的那一边生效(AODP 不给件数)。都没校准过。
  #   件数都指"最优价 near_pct 以内的件数",不是 Python 版的"卖一那一档"/"买方总件数"
  near_pct: 0.05          # 近价窗口:卖一往上 / 买一往下 5% 以内
  min_book_qty: 3         # 挂卖腿依托的卖方近价件数低于它 → thin_book。0 = 关闭
  thin_book_edge_qty: 10  # 低于它 → 降为 low 置信
  min_bid_depth: 20       # 挂买腿依托的买方近价件数低于它 → no_bid_side。0 = 关闭
  thin_bid_edge_qty: 100  # 低于它 → 降为 low 置信
  bid_cliff_edge_pct: 0.20  # 买方近价窗口外第一档落差达到它 → 降为 low。0 = 关闭
  max_spread_pct: 0.0     # 卖一/买一 − 1 超过它 → wide_spread。0 = 关闭

# 自建抓包的盘口怎么参与扫描。enabled 故意不写:用内置默认值(开,抓包价上榜前
# 要先过上面的深度判据)。要退回纯 AODP 就在这里加一行 enabled: false。
# 四个件数阈值都不能超过 book_levels
capture:
  max_hours: 0            # 扫描读抓包的窗口;0 = 跟 freshness.max_hours 一致
  depth_max_hours: 2.0    # 深度只信这么近的档,更旧的不参与判据
  snapshot_slack_seconds: 120   # 多宽算"同一眼";扫描、WS 报价、查价页共用。设成 ≥ 窗口 = 关掉残单剔除
  prefer_slack_minutes: 10      # 抓包比 AODP 旧不超过这么多,仍用抓包;扫描和查价页共用
  book_levels: 128        # 每个盘口最多读多少档
  max_extra_items: 300    # 配置清单外、抓包窗口里有挂单的物品最多并进扫描多少个(按物品计、按件数截断,
                          # 每个物品带上抓到的全部品质;清单物品抓到的别的品质不占名额);0 = 抓包不扩扫描
  reeval_seconds: 60      # 两次全量扫描之间,多久用缓存的 AODP 快照 + 最新抓包重算一次;不打 AODP。0 = 关闭

economics:
  market_tax: 0.04        # 高级会员 4%,非会员 8%
  setup_fee: 0.025        # 挂单手续费,不退
  buy_order_setup_fee: true   # 已确认收费(游戏内文本:买单也有"创建费"),见 CLAUDE.md
  outbid_silver: 1        # 挂买单要压过现有最高买单才排得到队首
  undercut_silver: 1      # 挂卖单同理

sizing:
  absorb_ratio: 0.20      # 敢吃日成交量的比例。第二阶段用实盘成交率校准这个数
  baseline_days: 7
  history_days: 30
  travel_hours: 0.5       # 跨城单程路上的时间(皇家城市之间)
  brecilien_travel_hours: 1.0   # 一端是 Brecilien 的路线单程时间:经迷雾,估的、没实测。0 = 同 travel_hours

api:
  max_url_length: 3500    # 官方 4096,留余量
  rate_per_minute: 170    # 官方 180
  rate_per_5min: 280      # 官方 300 —— 这条才是真约束(等效 56/分钟)
  timeout_seconds: 30.0
  max_retries: 4

# 物品清单:模式展开后对 ao-bin-dumps 的 items.txt 校验,不手写长串 ID。
# 起步只碰高流动性、低单价的品类 —— 单价高 = 占用本金多 = 周转慢。
items:
  patterns:
    # 精炼材料:全游戏成交量最大的品类
    - "T{4,5,6}_{CLOTH,METALBAR,PLANKS,LEATHER,STONEBLOCK}"
    # 原料:用于对比"卖原料 vs 卖半成品"
    - "T{4,5,6}_{FIBER,ORE,WOOD,HIDE,ROCK}"
    # 布甲三件套(学者/法师/神秘)
    - "T{4,5,6}_{HEAD,ARMOR,SHOES}_CLOTH_{SET1,SET2,SET3}"
    # 火法杖系
    - "T{4,5,6}_{MAIN_FIRESTAFF,2H_FIRESTAFF,2H_INFERNOSTAFF}"
  exclude: []
