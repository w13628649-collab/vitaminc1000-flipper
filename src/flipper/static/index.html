<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>albion flipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 白银是这个游戏的血液,底色就取银的冷灰。强调色是青铜——Albion 里到处都是的材质,
   不是又一个荧光绿。城市用游戏自己的六种代表色,玩家一眼能认。 */
:root{
  --paper:#dfe1e3; --surface:#eef0f1; --surface-2:#e6e8ea;
  --ink:#15181c; --ink-mid:#4a5158; --ink-soft:#7c858d;
  --rule:#c6cbcf; --rule-soft:#d6dadd;
  --bronze:#8a6320; --bronze-lift:#a87a2c;
  --gain:#2c6e49; --warn:#9c3232;
  --thetford:#6b4a8f; --fort-sterling:#69737d; --lymhurst:#4f7a3a;
  --martlock:#2f5d8a; --bridgewatch:#b07226; --caerleon:#9c3232;
  --brecilien:#2f7d7d; --black-market:#2a2a2a;
  /* 品质色沿用游戏里那套。普通在游戏里是白的,浅底上看不见,换成中灰 */
  --q1:#5f6368; --q2:#2f7d3f; --q3:#2563a8; --q4:#7a3fa8; --q5:#b0810f;
  --r:2px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo,system-ui,sans-serif; font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.wrap{max-width:1360px; margin:0 auto; padding:0 20px 72px}
a{color:var(--bronze)}
:focus-visible{outline:2px solid var(--bronze); outline-offset:2px}

/* ── 顶栏 ───────────────────────────────────────────── */
header{
  display:flex; flex-wrap:wrap; gap:20px; align-items:baseline;
  padding:22px 0 16px; border-bottom:2px solid var(--ink);
}
.brand{font-size:19px; font-weight:700; letter-spacing:-.02em}
.tabs{display:flex; gap:2px; margin-right:auto}
.tab{
  background:transparent; color:var(--ink-soft); border:1px solid transparent;
  border-radius:var(--r); padding:5px 13px; font-weight:600; font-size:13px;
}
.tab:hover{background:var(--surface); color:var(--ink); border-color:transparent}
.tab.on{background:var(--ink); color:var(--paper)}
.tab.on:hover{background:var(--ink); color:var(--paper)}
.brand span{color:var(--bronze)}
.facts{display:flex; gap:22px; flex-wrap:wrap}
.fact{display:flex; flex-direction:column; gap:1px}
.fact b{font-size:14px; font-weight:600; line-height:1.2}
.fact i{font-size:11px; font-style:normal; color:var(--ink-soft); font-weight:500}

/* ── 覆盖率:这个工具最先该回答的问题不是"赚多少",是"这份数据能不能信" ── */
.lede{padding:26px 0 8px; max-width:62ch}
.lede h1{font-size:26px; font-weight:700; letter-spacing:-.025em; margin:0 0 8px; line-height:1.15}
.lede p{margin:0; color:var(--ink-mid)}
.coverage{padding:22px 0 24px; border-bottom:1px solid var(--rule)}
.cov-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:16px; flex-wrap:wrap}
.cov-head h2{font-size:15px; font-weight:600; margin:0}
.cov-head em{font-style:normal; font-size:12px; color:var(--ink-soft)}
.cov-grid{display:grid; gap:7px}
.cov-row{display:grid; grid-template-columns:104px 1fr 118px; gap:14px; align-items:center}
.cov-city{display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px}
.dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--c)}
.bar{height:15px; background:var(--surface-2); border-radius:var(--r); overflow:hidden; display:flex}
.bar i{display:block; height:100%; transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar .fresh{background:var(--bronze)}
.bar .usable{background:var(--c); opacity:.42}
.bar .aged{background:var(--ink-soft); opacity:.18}
.cov-num{font-size:12px; color:var(--ink-mid); text-align:right}
.cov-num b{color:var(--ink); font-weight:600}
.cov-legend{display:flex; gap:16px; margin-top:12px; font-size:11.5px; color:var(--ink-soft)}
.cov-legend span{display:flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:1px; flex:none}
.swatch-city{background:linear-gradient(90deg,
  var(--thetford) 0 33%, var(--lymhurst) 33% 66%, var(--bridgewatch) 66%); opacity:.42}

/* ── 控制条 ─────────────────────────────────────────── */
.controls{
  display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end;
  padding:16px 0; border-bottom:1px solid var(--rule);
}
.ctrl{display:flex; flex-direction:column; gap:4px}
.ctrl label{font-size:11px; color:var(--ink-soft); font-weight:500}
select,input[type=number]{
  font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--rule);
  background:var(--surface); color:var(--ink); border-radius:var(--r); min-width:96px;
}
.toggle{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; padding-bottom:5px}
.toggle input{width:15px; height:15px; accent-color:var(--bronze); cursor:pointer}
.toggle span{font-size:13px}
button{
  font:inherit; font-weight:600; font-size:13px; cursor:pointer;
  padding:7px 16px; border-radius:var(--r); border:1px solid var(--ink);
  background:var(--ink); color:var(--paper); transition:background .15s,border-color .15s;
}
button:hover:not(:disabled){background:var(--bronze); border-color:var(--bronze)}
button:disabled{opacity:.45; cursor:progress}
button.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
button.ghost:hover:not(:disabled){background:var(--surface); color:var(--ink); border-color:var(--ink)}
.spacer{margin-left:auto}

/* ── 机会表 ─────────────────────────────────────────── */
.count{padding:16px 0 8px; font-size:13px; color:var(--ink-mid)}
.count b{color:var(--ink); font-weight:600; font-size:15px}
table{width:100%; border-collapse:collapse}
thead th{
  text-align:right; font-size:11px; font-weight:600; color:var(--ink-soft);
  padding:7px 10px; border-bottom:1px solid var(--ink); white-space:nowrap;
  cursor:pointer; user-select:none;
}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th:hover{color:var(--ink)}
thead th[aria-sort]{color:var(--bronze)}
thead th .arrow{opacity:.55; font-size:10px}
/* 数据越旧,这一行就越褪色——旧数据看起来就该旧 */
tbody tr{border-bottom:1px solid var(--rule-soft); --fade:0}
tbody tr:hover{background:var(--surface)}
tbody td{
  padding:9px 10px; text-align:right; white-space:nowrap;
  color:color-mix(in oklab, var(--ink), var(--paper) calc(var(--fade) * 46%));
}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
.item{display:flex; align-items:center; gap:9px; min-width:0}
.item img{width:30px; height:30px; flex:none; border-radius:var(--r); background:var(--surface-2)}
.item-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; display:block}
.item-id{font-size:10.5px; color:var(--ink-soft); font-weight:400; display:block}
button.jump{
  background:transparent; border:none; border-radius:var(--r); color:var(--ink);
  padding:2px 6px 2px 2px; margin-left:-2px; text-align:left; font-weight:400; width:100%;
}
button.jump:hover{background:transparent; color:var(--ink)}
button.jump:hover .item-name{color:var(--bronze); text-decoration:underline}
button.jump::after{content:"↗"; color:var(--ink-soft); font-size:10px; margin-left:auto; opacity:0}
button.jump:hover::after{opacity:1}
.city{display:flex; align-items:center; gap:6px; font-weight:500}
.quote{font-weight:600}
.quote i{font-style:normal; color:var(--ink-soft); font-weight:400; padding:0 3px}
.profit{font-weight:700; color:color-mix(in oklab, var(--gain), var(--paper) calc(var(--fade) * 46%))}
.roi{font-size:11.5px; color:var(--ink-soft); font-weight:500}
.age{display:flex; align-items:center; gap:6px; justify-content:flex-end; color:var(--ink-mid)}
.pip{width:7px; height:7px; border-radius:50%; flex:none}
.pip.high{background:var(--gain)} .pip.medium{background:var(--bronze-lift)} .pip.low{background:var(--warn)}
.note{font-size:11px; padding:0 10px 9px; text-align:left}
.note.warn{color:var(--warn)}
.note.hint{color:var(--ink-soft)}
/* 贴着 troll 阈值边缘才留在榜上的,给一条竖线,别让人只盯着绿色的日收益 */
tr.edge td:first-child{box-shadow:inset 3px 0 0 var(--warn)}

/* ── 过滤统计 ───────────────────────────────────────── */
.rejects{margin-top:28px; border-top:1px solid var(--rule); padding-top:18px}
.rejects summary{cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; gap:10px; align-items:baseline}
.rejects summary::-webkit-details-marker{display:none}
.rejects summary::before{content:"▸"; color:var(--bronze); font-size:11px}
.rejects[open] summary::before{content:"▾"}
.rejects summary em{font-style:normal; font-weight:400; color:var(--ink-soft); font-size:12px}
.reject-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px; margin-top:14px; background:var(--rule-soft)}
.reject-cell{background:var(--paper); padding:10px 12px}
.reject-cell b{display:block; font-size:18px; font-weight:700; line-height:1.1}
.reject-cell span{font-size:11.5px; color:var(--ink-soft)}
.diagnosis{margin-top:16px; padding:13px 15px; background:var(--surface); border-left:3px solid var(--bronze); font-size:13px; color:var(--ink-mid); max-width:76ch}
.diagnosis b{color:var(--ink)}

/* ── 空态 / 载入 ────────────────────────────────────── */
.empty{padding:26px 0 40px; max-width:58ch}
.empty h2{font-size:20px; font-weight:700; margin:0 0 8px; letter-spacing:-.02em}
.empty p{margin:0 0 18px; color:var(--ink-mid)}
.empty button{padding:10px 22px; font-size:14px}
.empty-sub{margin:11px 0 0!important; font-size:12.5px; color:var(--ink-soft)}
.bare{display:none}
footer{padding-top:26px; font-size:11.5px; color:var(--ink-soft); max-width:76ch}
footer p{margin:0 0 5px}

/* ── 查价 ──────────────────────────────────────────── */
.browse{
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end;
  padding:18px 0; border-bottom:1px solid var(--rule);
}
.browse .grow{flex:1 1 240px}

/* 三级菜单:大类 → 子类 → 物品族,并排三列。
   嵌套弹出在屏幕边缘会飞出去,并排列不会,而且三层同时可见。 */
.menu-wrap{position:relative}
#menu-btn{
  background:var(--surface); color:var(--ink); border:1px solid var(--rule);
  font-weight:600; font-size:13px; padding:5px 12px; min-width:220px; text-align:left;
  display:flex; align-items:center; gap:8px;
}
#menu-btn::after{content:"▾"; margin-left:auto; color:var(--ink-soft); font-size:10px}
#menu-btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink)}
#menu-btn[aria-expanded="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
#menu-btn[aria-expanded="true"]::after{color:var(--paper)}
.menu{
  position:absolute; z-index:40; top:calc(100% + 4px); left:0; display:flex;
  background:var(--surface); border:1px solid var(--ink); border-radius:var(--r);
  box-shadow:0 10px 30px rgba(21,24,28,.18); max-width:min(92vw, 780px); overflow-x:auto;
}
/* .bare 是全局的 display:none,但它定义在前面,同特异性下压不住这里的 display:flex */
.menu.bare{display:none}
.menu-col{
  width:196px; flex:none; max-height:378px; overflow-y:auto;
  border-right:1px solid var(--rule-soft); padding:4px 0;
}
.menu-col.wide{width:236px; border-right:none}
.menu-col:empty::before{
  content:"← 指向左边一栏"; display:block; padding:14px 12px;
  font-size:11.5px; color:var(--ink-soft);
}
.menu-col button{
  display:flex; width:100%; gap:8px; align-items:baseline; text-align:left;
  background:transparent; color:var(--ink); border:none; border-radius:0;
  padding:5px 11px; font-weight:500; font-size:13px;
}
.menu-col button:hover,.menu-col button.hot{background:var(--surface-2); color:var(--ink)}
.menu-col button.on{background:var(--ink); color:var(--paper)}
.menu-col button.on .num{color:var(--paper); opacity:.7}
.menu-col button .num{margin-left:auto; font-size:10.5px; color:var(--ink-soft); font-weight:400}
.menu-col button.has::after{content:"›"; color:var(--ink-soft); font-size:12px}
.menu-col button.on.has::after{color:var(--paper)}
.menu-head{
  padding:6px 11px 5px; font-size:10.5px; color:var(--ink-soft); font-weight:600;
  border-bottom:1px solid var(--rule-soft); margin-bottom:3px;
}
.browse .grow input{
  width:100%; font:inherit; font-size:14px; padding:5px 9px;
  border:1px solid var(--rule); border-radius:var(--r); background:var(--surface); color:var(--ink);
}
.browse .grow input:focus{border-color:var(--bronze); outline:none}
.browse select:disabled{opacity:.45}

.lookup-body{display:grid; grid-template-columns:302px minmax(0,1fr); gap:24px; padding-top:18px}
.itemlist{border-right:1px solid var(--rule); padding-right:18px; min-height:320px}
.itemlist-head{font-size:11.5px; color:var(--ink-soft); padding-bottom:8px; border-bottom:1px solid var(--rule-soft)}
#list{max-height:70vh; overflow-y:auto}
#list button{
  display:flex; width:100%; gap:9px; align-items:center; text-align:left;
  background:transparent; color:var(--ink); border:none; border-radius:0;
  border-bottom:1px solid var(--rule-soft); padding:6px 4px; font-weight:400;
}
#list button:hover{background:var(--surface); color:var(--ink)}
#list button.on{background:var(--ink); color:var(--paper)}
#list button.on .en,#list button.on .tierbadge{color:var(--paper); opacity:.72}
#list img{width:28px; height:28px; flex:none; background:var(--surface-2); border-radius:var(--r)}
#list .zh{font-weight:600; font-size:13px}
#list .en{font-size:10.5px; color:var(--ink-soft)}
.tierbadge{
  flex:none; width:25px; text-align:center; font-size:10.5px; font-weight:700;
  color:var(--bronze); border:1px solid var(--rule); border-radius:var(--r); padding:1px 0;
}

.lookup-head{display:flex; gap:14px; align-items:center; padding:2px 0 14px; flex-wrap:wrap}
.lookup-head img{width:52px; height:52px; border-radius:var(--r); background:var(--surface-2)}
.lookup-head h2{margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em}
.lookup-head .sub{font-size:12px; color:var(--ink-soft)}
.verdict{display:flex; gap:34px; flex-wrap:wrap; margin-left:auto; text-align:right}
.verdict div{display:flex; flex-direction:column; gap:1px}
.verdict b{font-size:15px; font-weight:700}
.verdict i{font-style:normal; font-size:11px; color:var(--ink-soft)}

.matrix{width:100%; border-collapse:collapse; margin-top:4px}
.matrix th{
  font-size:11px; font-weight:600; color:var(--ink-soft); padding:7px 8px;
  border-bottom:1px solid var(--ink); text-align:center; white-space:nowrap;
}
.matrix th:first-child{text-align:left; width:112px}
.matrix th .qdot{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--q); margin-right:5px; vertical-align:baseline;
}
.matrix th.q{color:var(--q); border-bottom-color:var(--q)}
.matrix th.flex,.matrix td.flex{width:auto; border-bottom-color:transparent}
.matrix th:not(:first-child):not(.flex),
.matrix td:not(:first-child):not(.flex){width:168px}
.matrix td{border-bottom:1px solid var(--rule-soft); padding:6px; vertical-align:top}
.matrix td:first-child{font-weight:600; font-size:13px; padding-left:0}
.cell{
  border:1px solid var(--rule-soft); border-radius:var(--r); padding:6px 8px;
  background:var(--surface); line-height:1.35;
}
.cell.void{background:transparent; border-style:dashed; color:var(--ink-soft); text-align:center; padding:12px 8px}
.cell .ln{display:grid; grid-template-columns:auto 1fr auto; gap:7px; align-items:baseline; font-size:12.5px}
.cell .ln u{text-decoration:none; color:var(--ink-soft); font-size:10.5px}
.cell .ln b{font-weight:600; text-align:right}
.cell .ln s{text-decoration:none; font-size:10px; color:var(--ink-soft)}
.cell .ln s.stale{color:var(--warn); opacity:.75}
.cell .meta{font-size:10.5px; color:var(--ink-soft); margin-top:4px; padding-top:4px;
  border-top:1px solid var(--rule-soft)}
.cell .spread{font-weight:600}
.cell .spread.up{color:var(--gain)}
.cell .spread.down{color:var(--ink-soft)}
.cell .spread.suspect{color:var(--warn); background:color-mix(in oklab, var(--warn), transparent 90%); padding:0 3px; border-radius:var(--r)}
/* 同一品质内最便宜的买入点和最贵的卖出点,只在新鲜度内的格子里选 */
.cell.best-buy{border-color:var(--gain); box-shadow:inset 0 0 0 1px var(--gain)}
.cell.best-sell{border-color:var(--bronze); box-shadow:inset 0 0 0 1px var(--bronze)}
.cell .tag{font-size:10px; font-weight:600; margin-top:3px}
.best-buy .tag{color:var(--gain)}
.best-sell .tag{color:var(--bronze)}
.matrix-note{margin-top:14px; font-size:12px; color:var(--ink-soft); max-width:74ch}
.matrix-note p{margin:0 0 7px}
.matrix-note b{color:var(--ink-mid)}
.matrix-note b.warnish{color:var(--warn)}

/* ── 销量榜 ────────────────────────────────────────── */
.cov-line{padding:14px 0 4px; font-size:12px; color:var(--ink-soft)}
.cov-line b{color:var(--ink); font-weight:600}
.rank-table{width:100%; border-collapse:collapse; margin-top:8px}
.rank-table th{
  text-align:right; font-size:11px; font-weight:600; color:var(--ink-soft);
  padding:7px 10px; border-bottom:1px solid var(--ink); white-space:nowrap;
  cursor:pointer; user-select:none;
}
.rank-table th:hover{color:var(--ink)}
.rank-table th[aria-sort]{color:var(--bronze)}
.rank-table th .arrow{font-size:10px; opacity:.6}
.rank-table th.plain{cursor:default}
.rank-table th.plain:hover{color:var(--ink-soft)}

/* 折线图:一列里看出是一路涨、一路跌,还是来回锯齿 */
.trend{display:flex; align-items:center; gap:8px; justify-content:flex-end}
.spark{flex:none; overflow:visible}
.spark path{fill:none; stroke-width:1.4; stroke-linejoin:round; stroke-linecap:round}
.spark circle{stroke:none}
.spark.up path,.spark.up circle{stroke:var(--gain); fill:var(--gain)}
.spark.down path,.spark.down circle{stroke:var(--warn); fill:var(--warn)}
.spark.choppy path,.spark.choppy circle{stroke:var(--bronze); fill:var(--bronze)}
.spark.flat path,.spark.flat circle{stroke:var(--ink-soft); fill:var(--ink-soft)}
.trend em{font-style:normal; font-size:11px; font-weight:600; width:46px; text-align:right}
.trend em.up{color:var(--gain)} .trend em.down{color:var(--warn)}
.trend em.choppy{color:var(--bronze)} .trend em.flat{color:var(--ink-soft)}
.rank-table th:first-child,.rank-table th:nth-child(2){text-align:left}
.rank-table td{padding:8px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--rule-soft)}
.rank-table td:first-child,.rank-table td:nth-child(2){text-align:left}
.rank-table tr:hover{background:var(--surface)}
.rank-no{color:var(--ink-soft); width:34px}
.rank-silver{font-weight:700; color:var(--gain)}
.rank-qty{font-weight:600}
/* 价格区间条:各物品价格量级差太远,每行按自己的 min–max 归一化。
   中位点偏左说明大部分日子价格在低位,偶尔被拉高。 */
.range{display:flex; align-items:center; gap:7px; justify-content:flex-end; min-width:190px}
.range em{font-style:normal; font-size:10.5px; color:var(--ink-soft); width:52px}
.range em.hi{text-align:left}
.range .track{
  position:relative; width:72px; height:5px; border-radius:3px; flex:none;
  background:linear-gradient(90deg, var(--surface-2), var(--rule));
}
.range .pin{
  position:absolute; top:-3px; left:var(--mid); width:3px; height:11px;
  background:var(--ink); border-radius:1px; transform:translateX(-50%);
}
.vol{font-weight:600}
.vol.calm{color:var(--ink-soft)}
.vol.swing{color:var(--bronze)}
.vol.wild{color:var(--warn)}

@media (max-width:920px){
  .hide-md{display:none}
  .matrix{display:block; overflow-x:auto}
  .verdict{margin-left:0; text-align:left}
  .lookup-body{grid-template-columns:1fr; gap:16px}
  .rank-table{display:block; overflow-x:auto}
  .itemlist{border-right:none; border-bottom:1px solid var(--rule); padding-right:0; min-height:0}
  #list{max-height:300px}
  .cov-row{grid-template-columns:88px 1fr 96px; gap:10px}
  .lede h1{font-size:22px}
}
@media (max-width:620px){
  .hide-sm{display:none}
  .wrap{padding:0 14px 56px}
  .facts{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">albion <span>flipper</span></div>
  <nav class="tabs">
    <button class="tab on" data-view="scan">价差扫描</button>
    <button class="tab" data-view="lookup">查价</button>
    <button class="tab" data-view="rank">销量榜</button>
  </nav>
  <div class="facts" id="facts"></div>
</header>

<section id="lede" class="lede">
  <h1>先看数据能不能信,再看能赚多少</h1>
  <p>AODP 的价格靠玩家自愿上传——必须有人在游戏里翻到那一页市场,数据才会进库。
     亚服人少,一条 15 小时前的完美价差没有意义。所以这里先给各城覆盖率。</p>
</section>

<section id="coverage" class="coverage bare">
  <div class="cov-head">
    <h2>各城数据覆盖率</h2>
    <em id="cov-note"></em>
  </div>
  <div class="cov-grid" id="cov-grid"></div>
  <div class="cov-legend">
    <span><i class="swatch" style="background:var(--bronze)"></i><b id="lg-fresh">2 小时内</b></span>
    <span><i class="swatch swatch-city"></i><b id="lg-usable">可用</b>(按城市着色)</span>
    <span><i class="swatch" style="background:var(--ink-soft);opacity:.18"></i>超出阈值</span>
    <span><i class="swatch" style="background:var(--surface-2)"></i>无人上传</span>
  </div>
</section>

<section class="controls">
  <div class="ctrl">
    <label for="max-age">新鲜度上限</label>
    <select id="max-age">
      <option value="2">2 小时</option>
      <option value="6" selected>6 小时</option>
      <option value="12">12 小时</option>
      <option value="24">24 小时</option>
      <option value="72">72 小时</option>
    </select>
  </div>
  <div class="ctrl">
    <label for="capital">本金(银)</label>
    <input id="capital" type="number" step="1000000" min="0" value="10000000">
  </div>
  <div class="ctrl">
    <label for="city">城市</label>
    <select id="city"><option value="">全部</option></select>
  </div>
  <div class="ctrl">
    <label for="conf">最低置信度</label>
    <select id="conf">
      <option value="low" selected>全部</option>
      <option value="medium">medium 以上</option>
      <option value="high">仅 high</option>
    </select>
  </div>
  <label class="toggle" title="待游戏内确认。关掉后摩擦从 9% 降到 6.5%,机会会明显变多">
    <input type="checkbox" id="buyfee" checked>
    <span>挂买单收 2.5%</span>
  </label>
  <div class="spacer"></div>
  <button id="scan" class="bare">重新扫描</button>
</section>

<div id="empty" class="empty">
  <button id="scan-first">开始扫描</button>
  <p class="empty-sub" id="empty-sub">拉取全部物品在各城的当前挂单价和 30 天成交历史。</p>
</div>

<div id="results" class="bare">
  <div class="count" id="count"></div>
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <details class="rejects" id="rejects">
    <summary>被过滤的候选 <em id="reject-total"></em></summary>
    <div class="reject-grid" id="reject-grid"></div>
    <div id="diagnosis"></div>
  </details>
</div>

<section id="view-lookup" class="bare">
  <div class="browse">
    <div class="ctrl menu-wrap">
      <label id="menu-label">分类</label>
      <button id="menu-btn" aria-haspopup="true" aria-expanded="false">全部物品</button>
      <div id="menu" class="menu bare" role="menu" aria-labelledby="menu-label">
        <div class="menu-col" id="m-cat"></div>
        <div class="menu-col" id="m-sub"></div>
        <div class="menu-col wide" id="m-fam"></div>
      </div>
    </div>
    <div class="ctrl"><label for="f-tier">等级</label>
      <select id="f-tier"><option value="0">全部</option></select></div>
    <div class="ctrl"><label for="f-ench">附魔</label>
      <select id="f-ench"><option value="-1">全部</option></select></div>
    <div class="ctrl"><label for="f-qual">品质</label>
      <select id="f-qual"><option value="0">全部</option></select></div>
    <div class="ctrl grow"><label for="q">搜索</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="中文、英文或物品 ID —— 输入后忽略上面的分类"></div>
  </div>

  <div class="lookup-body">
    <aside class="itemlist">
      <div class="itemlist-head" id="list-head">选个分类,或者直接搜</div>
      <div id="list"></div>
    </aside>
    <div class="pricepanel">
      <div id="lookup-empty" class="empty">
        <p>游戏里一次只能看当前所在城市的一个品质。这里把所有城市 × 所有品质摊成一张表,
           另外带上黑市和 7 日均价。</p>
      </div>
      <div id="lookup-result" class="bare"></div>
    </div>
  </div>
</section>

<section id="view-rank" class="bare">
  <div class="browse">
    <div class="ctrl"><label for="r-window">统计窗口</label>
      <select id="r-window">
        <option value="7" selected>最近 7 天</option>
        <option value="14">最近 14 天</option>
        <option value="30">最近 30 天</option>
      </select></div>
    <div class="ctrl"><label for="r-city">城市</label>
      <select id="r-city"><option value="all">全服合计</option></select></div>
    <div class="ctrl"><label for="r-quality">品质</label>
      <select id="r-quality"></select></div>
    <div class="ctrl"><label for="r-cat">分类</label>
      <select id="r-cat"><option value="">全部已抓取</option></select></div>
    <div class="ctrl"><label for="r-sub">子类</label>
      <select id="r-sub"><option value="">全部</option></select></div>
    <div class="spacer"></div>
    <button id="r-pull" class="ghost">抓取这个分类的历史</button>
  </div>

  <div id="rank-cov" class="cov-line"></div>
  <div id="rank-body"></div>
</section>

<footer id="foot"></footer>
</div>

<script>
const CITY_VAR = {
  "Thetford":"--thetford","Fort Sterling":"--fort-sterling","Lymhurst":"--lymhurst",
  "Martlock":"--martlock","Bridgewatch":"--bridgewatch","Caerleon":"--caerleon",
  "Brecilien":"--brecilien","Black Market":"--black-market",
};
const CITY_SHORT = {
  "Thetford":"Thetford","Fort Sterling":"Ft Sterling","Lymhurst":"Lymhurst",
  "Martlock":"Martlock","Bridgewatch":"Bridgewatch","Caerleon":"Caerleon",
};
const cityColor = c => `var(${CITY_VAR[c] || "--ink-soft"})`;

const silver = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(2) + "M";
  if (a >= 1e3) return (v/1e3).toFixed(1) + "k";
  return Math.round(v).toLocaleString();
};
const pct = v => (v*100).toFixed(1) + "%";
const num = v => Math.round(v).toLocaleString();

const COLUMNS = [
  {key:"item_name",  label:"物品",      align:"left"},
  {key:"city",       label:"城市",      align:"left", cls:"hide-sm"},
  {key:"my_bid",     label:"挂买 → 挂卖"},
  {key:"margin",     label:"毛利"},
  {key:"daily_volume_silver", label:"日流水", cls:"hide-md"},
  {key:"qty",        label:"可吃量",    cls:"hide-md"},
  {key:"capital_used", label:"占用本金", cls:"hide-sm"},
  {key:"daily_profit", label:"日收益"},
  {key:"data_age_hours", label:"数据龄"},
];

const state = {payload:null, sortKey:"daily_profit", sortDir:-1, loading:false};

const $ = id => document.getElementById(id);

async function api(path, body) {
  const res = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body),
  } : undefined);
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.json();
}

function renderFacts(e) {
  $("facts").innerHTML = [
    ["服务器", e.server],
    ["本金", silver(e.capital) + " 银"],
    ["往返摩擦", pct(e.friction)],
  ].map(([k,v]) => `<div class="fact"><b>${v}</b><i>${k}</i></div>`).join("");
}

function renderCoverage(p) {
  const maxPoints = p.summary.item_count * 2;   // 每个物品有买卖两侧
  const hiHours = p.effective.high_confidence_hours;
  $("lg-fresh").textContent = `${hiHours} 小时内`;
  $("lg-usable").textContent = `${hiHours}–${p.effective.max_age_hours} 小时`;

  $("cov-grid").innerHTML = p.coverage.map(c => {
    const fresh = c.within_2h;                                    // high 置信的门槛
    const usable = Math.max(0, c.within_threshold - fresh);       // 还能用,但旧
    const aged = Math.max(0, c.with_data - c.within_threshold);   // 有数据却超了阈值
    const w = n => (maxPoints ? (n / maxPoints * 100).toFixed(2) : 0) + "%";
    return `<div class="cov-row" style="--c:${cityColor(c.city)}">
      <div class="cov-city"><i class="dot"></i>${CITY_SHORT[c.city] || c.city}</div>
      <div class="bar">
        <i class="fresh" style="width:${w(fresh)}"></i>
        <i class="usable" style="width:${w(usable)}"></i>
        <i class="aged" style="width:${w(aged)}"></i>
      </div>
      <div class="cov-num"><b>${c.within_threshold}</b>/${maxPoints} 可用 · ${
        c.median_age_hours === null ? "无数据" : c.median_age_hours.toFixed(1) + "h"}</div>
    </div>`;
  }).join("");
  const usable = p.coverage.reduce((s,c) => s + c.within_threshold, 0);
  const fresh = p.coverage.reduce((s,c) => s + c.within_2h, 0);
  const totalPoints = maxPoints * p.summary.city_count;
  $("cov-note").textContent =
    `${p.summary.item_count} 个物品 × ${p.summary.city_count} 城 = ${totalPoints} 个可能的报价点 · `
    + `${usable} 个在 ${p.effective.max_age_hours} 小时新鲜度内,其中 ${fresh} 个在 ${hiHours} 小时内`;
}

function sortedRows() {
  const conf = $("conf").value, city = $("city").value;
  const rank = {low:0, medium:1, high:2};
  return state.payload.opportunities
    .filter(o => rank[o.confidence] >= rank[conf])
    .filter(o => !city || o.city === city)
    .sort((a,b) => {
      const k = state.sortKey;
      const va = a[k], vb = b[k];
      const d = typeof va === "string" ? va.localeCompare(vb) : va - vb;
      return d * state.sortDir;
    });
}

function renderHead() {
  $("head").innerHTML = COLUMNS.map(c => {
    const on = c.key === state.sortKey;
    const dir = state.sortDir < 0 ? "descending" : "ascending";
    return `<th data-key="${c.key}" class="${c.cls||""}" ${on ? `aria-sort="${dir}"` : ""}
      >${c.label}${on ? ` <span class="arrow">${state.sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`;
  }).join("");
  $("head").querySelectorAll("th").forEach(th => th.onclick = () => {
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = key === "item_name" || key === "city" ? 1 : -1; }
    renderTable();
  });
}

// 置信度不只由数据龄决定,贴着过滤阈值边缘也会降级 —— 悬停说清楚是哪种
function confidenceReason(o, e) {
  if (o.warnings.length) return `low — 贴着过滤阈值边缘:${o.warnings.join(";")}`;
  if (o.data_age_hours <= e.high_confidence_hours) return `high — 买卖两侧都在 ${e.high_confidence_hours} 小时内`;
  return `medium — 买卖两侧都在 ${e.max_age_hours} 小时内,但超过 ${e.high_confidence_hours} 小时`;
}

function renderTable() {
  const rows = sortedRows();
  const p = state.payload;
  const by = p.summary.by_confidence;
  $("count").innerHTML = rows.length
    ? `<b>${rows.length}</b> 条机会 — high ${by.high} / medium ${by.medium} / low ${by.low}
       · 数据龄 ${p.summary.age_min.toFixed(1)}h 至 ${p.summary.age_max.toFixed(1)}h`
    : `<b>0</b> 条机会通过当前筛选`;

  const maxAge = p.effective.max_age_hours;
  const e = p.effective;
  $("rows").innerHTML = rows.map(o => {
    // 褪色程度 = 数据龄占新鲜度上限的比例,封顶 1
    const fade = Math.min(1, o.data_age_hours / Math.max(maxAge, 0.5));
    const icon = iconUrl(o.item_id);
    const line = (cls, items) => items.length
      ? `<tr style="--fade:${fade.toFixed(2)}"><td colspan="${COLUMNS.length}" class="note ${cls}">${items.join(" · ")}</td></tr>`
      : "";
    const note = line("warn", o.warnings) + line("hint", o.hints);
    return `<tr class="${o.warnings.length ? "edge" : ""}" style="--fade:${fade.toFixed(2)}">
      <td><button class="item jump" data-id="${o.item_id}" title="查这个物品在所有城市的价格">
        <img src="${icon}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span style="min-width:0"><span class="item-name">${o.item_name}</span>
        <span class="item-id">${o.item_id}</span></span>
      </button></td>
      <td class="hide-sm"><div class="city"><i class="dot" style="--c:${cityColor(o.city)}"></i>${
        CITY_SHORT[o.city] || o.city}</div></td>
      <td class="quote">${num(o.my_bid)}<i>→</i>${num(o.my_ask)}</td>
      <td>${pct(o.margin)}</td>
      <td class="hide-md">${silver(o.daily_volume_silver)}</td>
      <td class="hide-md">${num(o.qty)}</td>
      <td class="hide-sm">${silver(o.capital_used)}</td>
      <td><span class="profit">${silver(o.daily_profit)}</span>
          <div class="roi">本金 ${(o.capital_roi*100).toFixed(1)}%</div></td>
      <td><div class="age" title="${confidenceReason(o, e)}"><i class="pip ${o.confidence}"></i>${o.data_age_hours.toFixed(1)}h</div></td>
    </tr>${note}`;
  }).join("");
}

function renderRejects(p) {
  const total = p.summary.rejected_total;
  // 机会少的时候,"为什么这么少"才是最该看的信息,别藏在折叠里
  $("rejects").open = state.payload.opportunities.length < 5;
  $("reject-total").textContent = `${total} 条 — 这些就是天真计算器会报成机会的那些`;
  $("reject-grid").innerHTML = p.rejected.map(r =>
    `<div class="reject-cell"><b>${r.count}</b><span>${r.label}</span></div>`).join("");

  const get = n => (p.rejected.find(r => r.reason === n) || {count:0}).count;
  const coverage = get("one_sided") + get("stale") + get("no_timestamp");
  const troll = get("deviation") + get("implausible_margin") + get("crossed_book");
  const hints = [];
  if (total && coverage / total > 0.5) hints.push(
    `<b>${coverage}/${total}</b> 条死在数据覆盖率上(单边或过期)——不是价差不存在,是没人上传。
     放宽新鲜度能看到更多,但那些价格实盘八成已经变了。要根治得自己跑 albiondata-client 抓包。`);
  if (troll) hints.push(
    `<b>${troll}</b> 条被 troll 过滤拦下。AODP 不返回挂单数量,"最低卖价 1000"可能只对应 1 件货,
     这些正是买了就套死的挂单。`);
  if (!troll && total) hints.push(
    `troll 过滤这次一条都没拦到。高流动性品类上的恶意挂单会被真实挂单淹没,
     真正在起作用的是新鲜度和单边过滤。扩到低流动性物品时再回头看这个数。`);
  $("diagnosis").innerHTML = hints.map(h => `<div class="diagnosis">${h}</div>`).join("");
}

function render(p) {
  state.payload = p;
  renderFacts(p.effective);
  renderCoverage(p);
  renderHead();
  renderTable();
  renderRejects(p);

  const cityPicker = $("city");
  if (cityPicker.options.length <= 1) {
    p.effective.cities.forEach(c => cityPicker.add(new Option(CITY_SHORT[c] || c, c)));
  }
  $("empty").style.display = "none";
  $("lede").style.display = "none";
  $("scan").classList.remove("bare");
  $("coverage").classList.remove("bare");
  $("results").classList.remove("bare");

  const when = new Date(p.scanned_at);
  $("foot").innerHTML =
    `<p>扫描于 ${when.toLocaleString("zh-CN")},${p.summary.price_rows} 条报价,${p.summary.request_count} 次 API 请求。</p>
     <p>往返摩擦 ${pct(p.effective.friction)},${
       p.effective.buy_order_setup_fee
         ? "其中挂买单那 2.5% 还没在游戏里确认。关掉它,摩擦降到 6.5%,机会会明显变多。"
         : "不含挂买单手续费。"}</p>
     <p>排序主键是日化绝对收益,不是利润率:毛利 30% 但一天只能做 3 件,不如 5% 但能做 2000 件。</p>`;
}

async function doScan() {
  if (state.loading) return;
  state.loading = true;
  const btns = [$("scan"), $("scan-first")];
  btns.forEach(b => { b.disabled = true; });
  $("scan").textContent = "扫描中…";
  try {
    render(await api("/api/scan", {
      max_age_hours: Number($("max-age").value),
      capital: Number($("capital").value),
      buy_order_setup_fee: $("buyfee").checked,
    }));
  } catch (err) {
    $("empty").style.display = "block";
    $("empty").innerHTML =
      `<h2>扫描失败</h2><p>${err.message}</p>
       <button onclick="location.reload()">重试</button>`;
  } finally {
    state.loading = false;
    btns.forEach(b => { b.disabled = false; });
    $("scan").textContent = "重新扫描";
  }
}

$("rows").addEventListener("click", e => {
  const btn = e.target.closest("button.jump");
  if (btn) gotoItem(btn.dataset.id);
});

$("scan").onclick = doScan;
$("scan-first").onclick = doScan;
["conf","city"].forEach(id => $(id).onchange = () => state.payload && renderTable());

// ── 查价 ──────────────────────────────────────────────
const lookup = {itemId:null, timer:null, cats:null, list:[], sel:{cat:"", sub:"", fam:""}};

// 走本地缓存代理,不然翻一页分类的上百个并发请求会被 render 站限流
const iconUrl = id => `/api/icon/${encodeURIComponent(id)}.png`;

function showView(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  const onScan = name === "scan";
  ["lede","coverage","empty","results"].forEach(id => {
    const el = $(id);
    if (el) el.style.display = onScan ? "" : "none";
  });
  document.querySelector(".controls").style.display = onScan ? "" : "none";
  $("view-lookup").classList.toggle("bare", name !== "lookup");
  $("view-rank").classList.toggle("bare", name !== "rank");
  if (name !== "scan") loadCategories().then(() => name === "rank" && initRank());
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  const view = b.dataset.view;
  showView(view);
  location.hash = view === "lookup"
    ? (lookup.itemId ? `#item/${lookup.itemId}` : "#lookup")
    : view === "rank" ? "#rank" : "";
});

// 分类树一次拉全,三级菜单靠悬停展开,不再等网络
async function loadCategories() {
  if (lookup.cats) return;
  lookup.cats = await api("/api/categories");
  lookup.cats.tiers.forEach(n => $("f-tier").add(new Option(`T${n}`, String(n))));
  lookup.cats.enchantments.forEach(n =>
    $("f-ench").add(new Option(n === 0 ? "无附魔" : `.${n}`, String(n))));
  lookup.cats.qualities.forEach(q => $("f-qual").add(new Option(q.label, String(q.value))));
  renderMenu();
}

// ── 三级菜单:大类 → 子类 → 物品族 ───────────────────────
const menuNode = () => (lookup.cats?.tree || []).find(c => c.id === lookup.sel.cat);
const subNode = () => (menuNode()?.subs || []).find(s => s.id === lookup.sel.sub);

function menuButton(item, {on, has, onHover, onPick}) {
  const b = document.createElement("button");
  b.className = `${on ? "on " : ""}${has ? "has" : ""}`;
  b.innerHTML = `<span>${item.label}</span><span class="num">${item.count}</span>`;
  b.onmouseenter = onHover;
  b.onfocus = onHover;
  b.onclick = onPick;
  return b;
}

function renderMenu() {
  const cats = lookup.cats?.tree || [];
  const cat = $("m-cat"), sub = $("m-sub"), fam = $("m-fam");
  cat.innerHTML = `<div class="menu-head">分类</div>`;
  sub.innerHTML = lookup.sel.cat ? `<div class="menu-head">子类</div>` : "";
  fam.innerHTML = lookup.sel.sub ? `<div class="menu-head">物品</div>` : "";

  cats.forEach(c => cat.append(menuButton(c, {
    on: c.id === lookup.sel.cat, has: true,
    // 悬停只展开下一栏,不动筛选 —— 手划过去不该把结果刷掉
    onHover: () => { if (lookup.sel.cat !== c.id) { lookup.sel = {cat:c.id, sub:"", fam:""}; renderMenu(); } },
    onPick: () => pickMenu({cat: c.id}),
  })));

  (menuNode()?.subs || []).forEach(s => sub.append(menuButton(s, {
    on: s.id === lookup.sel.sub, has: (s.families || []).length > 1,
    onHover: () => { if (lookup.sel.sub !== s.id) { lookup.sel.sub = s.id; lookup.sel.fam = ""; renderMenu(); } },
    onPick: () => pickMenu({cat: lookup.sel.cat, sub: s.id}),
  })));

  (subNode()?.families || []).forEach(f => fam.append(menuButton(
    {label: f.label, count: f.count},
    {
      on: f.key === lookup.sel.fam, has: false,
      onHover: () => {},
      onPick: () => pickMenu({cat: lookup.sel.cat, sub: lookup.sel.sub, fam: f.key}),
    })));
}

function menuPath() {
  const parts = [];
  if (menuNode()) parts.push(menuNode().label);
  if (subNode()) parts.push(subNode().label);
  const f = (subNode()?.families || []).find(x => x.key === lookup.sel.fam);
  if (f) parts.push(f.label);
  return parts.length ? parts.join(" › ") : "全部物品";
}

function pickMenu(sel) {
  lookup.sel = {cat: sel.cat || "", sub: sel.sub || "", fam: sel.fam || ""};
  $("menu-btn").textContent = menuPath();
  closeMenu();
  refreshList();
}

function openMenu() {
  $("menu").classList.remove("bare");
  $("menu-btn").setAttribute("aria-expanded", "true");
  renderMenu();
}
function closeMenu() {
  $("menu").classList.add("bare");
  $("menu-btn").setAttribute("aria-expanded", "false");
}
$("menu-btn").onclick = () =>
  $("menu").classList.contains("bare") ? openMenu() : closeMenu();
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

async function refreshList() {
  const q = $("q").value.trim();
  const head = $("list-head");
  // 搜索和分类是互斥的两条路,置灰比只写一句 placeholder 说得清楚
  ["menu-btn","f-tier","f-ench"].forEach(id => { $(id).disabled = !!q; });
  let rows = [];
  if (q) {
    // 搜索优先级高于分类 —— 知道名字的时候不该还要先翻分类
    rows = await api(`/api/items/search?q=${encodeURIComponent(q)}&limit=200`);
    head.textContent = `搜索「${q}」— ${rows.length} 个`;
  } else if (lookup.sel.cat || $("f-tier").value !== "0" || $("f-ench").value !== "-1") {
    const p = new URLSearchParams({
      category: lookup.sel.cat,
      subcategory: lookup.sel.sub,
      family: lookup.sel.fam,
      tier: $("f-tier").value,
      enchantment: $("f-ench").value,
      limit: "300",
    });
    rows = await api(`/api/items/browse?${p}`);
    head.textContent = `${menuPath()} — ${rows.length} 个${rows.length >= 300 ? "(已截断)" : ""}`;
  } else {
    head.textContent = "从上面的分类挑,或者直接搜";
  }
  lookup.list = rows;
  renderList();
  $("list").scrollTop = 0;
}

function renderList() {
  $("list").innerHTML = lookup.list.map(it => `
    <button data-id="${it.item_id}" class="${it.item_id === lookup.itemId ? "on" : ""}">
      <img src="${iconUrl(it.item_id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="tierbadge">T${it.tier}</span>
      <span><span class="zh">${it.display_name}</span><br><span class="en">${it.name_en}</span></span>
    </button>`).join("") || `<div class="empty"><p>没有匹配的物品。</p></div>`;
  $("list").querySelectorAll("button").forEach(b => b.onclick = () => selectItem(b.dataset.id));
}

const debounced = fn => { clearTimeout(lookup.timer); lookup.timer = setTimeout(fn, 220); };
$("q").oninput = () => debounced(refreshList);
["f-tier","f-ench"].forEach(id => $(id).onchange = refreshList);
$("f-qual").onchange = () => lookup.data && renderPrices(lookup.data);

async function selectItem(itemId) {
  lookup.itemId = itemId;
  renderList();
  location.hash = `#item/${itemId}`;
  $("lookup-empty").style.display = "none";
  const box = $("lookup-result");
  box.classList.remove("bare");
  box.innerHTML = `<div class="empty"><p>正在查 ${itemId} …</p></div>`;
  try {
    lookup.data = await api(`/api/prices/${encodeURIComponent(itemId)}`);
    renderPrices(lookup.data);
  } catch (err) {
    box.innerHTML = `<div class="empty"><h2>查不到</h2><p>${err.message}</p></div>`;
  }
}

function renderPrices(d) {
  const fresh = c => c.sell_age_hours !== null && c.sell_age_hours <= d.max_age_hours;
  const freshBuy = c => c.buy_age_hours !== null && c.buy_age_hours <= d.max_age_hours;

  // 最优点按品质分别算。不同品质是不同的商品,拿"优秀"的价跟"杰出"的价比毫无意义
  // ——一个卓越品质的长袍卖得比普通贵三倍,那不是价差,那是另一件东西。
  // 同一品质内跨城比才是倒爷要的。新鲜度外的报价不参与:30 小时前的低价没有意义。
  const best = {};
  d.qualities.forEach(q => {
    const buyable = d.cells.filter(c => c.quality === q.value && c.sell_price_min && fresh(c));
    const sellable = d.cells.filter(c => c.quality === q.value && c.buy_price_max && freshBuy(c));
    best[q.value] = {
      buy: buyable.length
        ? buyable.reduce((a, b) => (b.sell_price_min < a.sell_price_min ? b : a)) : null,
      sell: sellable.length
        ? sellable.reduce((a, b) => (b.buy_price_max > a.buy_price_max ? b : a)) : null,
    };
  });

  // 全空的品质列直接不画,否则大部分物品是一张 80% 空白的表
  const only = Number($("f-qual").value || 0);
  const pool = only ? d.qualities.filter(q => q.value === only) : d.qualities;
  const live = pool.filter(q =>
    d.cells.some(c => c.quality === q.value && (c.sell_price_min || c.buy_price_max)));
  const shown = live.length ? live : pool.slice(0, 1);
  const hidden = only ? [] : d.qualities.filter(q => !shown.includes(q));
  // 材料只有普通一档,品质筛选对它没有意义
  $("f-qual").disabled = (d.item.max_quality || 1) < 2;
  if ($("f-qual").disabled) $("f-qual").value = "0";

  const at = c => `${CITY_SHORT[c.city] || c.city} · ${
    (d.qualities.find(q => q.value === c.quality) || {}).label}`;

  // 顶栏只能报一个品质,挑新鲜数据最多的那档
  const headline = [...d.qualities]
    .map(q => ({
      q,
      live: d.cells.filter(c => c.quality === q.value && ((c.sell_price_min && fresh(c))
        || (c.buy_price_max && freshBuy(c)))).length,
    }))
    .sort((a, b) => b.live - a.live)[0];
  const bestBuy = headline && headline.live ? best[headline.q.value].buy : null;
  const bestSell = headline && headline.live ? best[headline.q.value].sell : null;

  const head = `<div class="lookup-head">
    <img src="${iconUrl(d.item.item_id)}" alt="" onerror="this.style.visibility='hidden'">
    <div>
      <h2>${d.item.display_name}</h2>
      <div class="sub">${d.item.name_en} · ${d.item.item_id}</div>
    </div>
    <div class="verdict">
      <div><b>${bestBuy ? num(bestBuy.sell_price_min) : "—"}</b>
           <i>全服最便宜,在这买 ${bestBuy ? at(bestBuy) : "— 无新鲜数据"}</i></div>
      <div><b>${bestSell ? num(bestSell.buy_price_max) : "—"}</b>
           <i>全服出价最高,在这卖 ${bestSell ? at(bestSell) : "— 无新鲜数据"}</i></div>
    </div>
  </div>`;

  // 买卖两侧的时间戳常常差很远,各报各的龄。
  // 标签用游戏里市场那两个页签的说法(销售订单 / 购买订单),
  // "买入/卖出"这种第一人称说法方向老是反着理解。
  const side = (label, price, age, hint) => {
    const stale = age === null || age > d.max_age_hours;
    return `<div class="ln" title="${hint}"><u>${label}</u><b>${price ? num(price) : "—"}</b>
      <s class="${stale && price ? "stale" : ""}">${age === null ? "" : age.toFixed(1) + "h"}</s></div>`;
  };

  const cell = c => {
    if (!c.sell_price_min && !c.buy_price_max) return `<div class="cell void">无数据</div>`;
    const pick = best[c.quality] || {};
    const cls = [
      "cell",
      c === pick.buy ? "best-buy" : "",
      c === pick.sell ? "best-sell" : "",
    ].join(" ");
    const tags = [
      c === pick.buy ? "本档最便宜" : "",
      c === pick.sell ? "本档出价最高" : "",
    ].filter(Boolean).join(" · ");
    // 价差大得不真实时别用绿色 —— 那等于在暗示"好机会"。
    // 扫描页有五层 troll 过滤拦着这种数据,查价页展示原始值,就得靠标色提醒。
    const suspectAt = (d.max_margin ?? 1) * 100;
    const cls2 = c.spread_pct > suspectAt ? "suspect"
               : c.spread_pct > 0 ? "up" : "down";
    const hint = c.spread_pct > suspectAt
      ? `毛利率 ${c.spread_pct}% 高得不真实,多半是某一侧挂了 troll 单(1 件货、价格离谱)。AODP 拿不到挂单数量,这种单看不出来只有一件`
      : "在这座城挂买单收货、再挂卖单出货,一轮下来的税后净毛利率";
    const spread = c.spread_pct === null || c.spread_pct === undefined
      ? ""
      : `<span class="spread ${cls2}" title="${hint}">同城价差 ${
          c.spread_pct > 0 ? "+" : ""}${c.spread_pct}%${cls2 === "suspect" ? " ⚠" : ""}</span> · `;
    return `<div class="${cls}">
      ${side("卖单最低", c.sell_price_min, c.sell_age_hours,
             "市场上最便宜的那张卖单。你想马上买到货,就付这个价")}
      ${side("买单最高", c.buy_price_max, c.buy_age_hours,
             "市场上出价最高的那张买单。你想马上出货,就拿这个价")}
      <div class="meta">${spread}均 ${c.avg_price_7d ? num(c.avg_price_7d) : "—"}${
        c.daily_volume_qty ? " · 日均 " + num(c.daily_volume_qty) + " 件" : ""}</div>
      ${tags ? `<div class="tag">${tags}</div>` : ""}
    </div>`;
  };

  const rows = d.cities.map(city => `<tr>
    <td><span class="city"><i class="dot" style="--c:${cityColor(city)}"></i>${
      CITY_SHORT[city] || city}</span></td>
    ${shown.map(q => `<td>${cell(d.cells.find(c => c.city === city && c.quality === q.value) || {})}</td>`).join("")}
    <td class="flex"></td>
  </tr>`).join("");

  $("lookup-result").innerHTML = head + `
    <table class="matrix">
      <thead><tr><th>城市</th>${shown.map(q =>
        `<th class="q" style="--q:var(--q${q.value})"><i class="qdot"></i>${q.label}</th>`
      ).join("")}<th class="flex"></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="matrix-note">
      <p><b>卖单最低</b>就是游戏里市场「销售订单」页签最上面那一行——别人挂着卖的最低价。
      你想马上买到货,付的就是它。<b>买单最高</b>是「购买订单」页签最上面那一行——
      别人挂着收的最高价。你想马上出货,拿的就是它。</p>
      <p>所以<b>卖单价总是比买单价高</b>,这段差就是倒爷的利润空间。
      <b>同城价差</b>已经替你把 ${pct(d.friction)} 的税和手续费扣掉了:
      在这座城挂买单收货、再挂卖单出货,一轮下来的净毛利率。为正才值得做。
      标<b class="warnish">⚠</b> 的是超过 ${(d.max_margin ?? 1) * 100}% 的价差——这种数字通常不是机会,
      而是某一侧挂了 troll 单。AODP 拿不到挂单数量,一张 1 件货的离谱报价和真实行情长得一模一样。</p>
      <p>标红的时间是超过 ${d.max_age_hours} 小时新鲜度上限的报价。最低/最高标记只在新鲜数据里选,
      且只在同一品质内比 —— 不同品质是不同的商品。
      ${(d.item.max_quality || 1) < 2
          ? "这类物品只有普通一档品质。"
          : hidden.length ? `${hidden.map(q => q.label).join("、")}品质全无数据,已隐藏。` : ""}
      ${only ? `只显示${(d.qualities.find(q => q.value === only) || {}).label}品质。` : ""}
      查询于 ${new Date(d.fetched_at).toLocaleString("zh-CN")}。</p>
    </div>`;
}

async function gotoItem(itemId) {
  showView("lookup");
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("on", b.dataset.view === "lookup"));
  await selectItem(itemId);
  const it = lookup.data?.item;
  if (it?.category) {
    await loadCategories();
    lookup.sel = {cat: it.category, sub: it.subcategory || "", fam: it.family || ""};
    $("menu-btn").textContent = menuPath();
    $("q").value = "";
    await refreshList();
    renderList();
  }
  window.scrollTo({top: 0, behavior: "smooth"});
}

// ── 销量榜 ────────────────────────────────────────────
const rankState = {ready:false, busy:false, sort:"daily_silver", order:"desc"};

// 折线图。x 用真实日期序号,缺数据的日子会留出空档,不会被挤成等距
function sparkline(series, trend) {
  if (!series || series.length < 2) return "";
  const xs = series.map(p => p[0]), ys = series.map(p => p[1]);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  const [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  const W = 84, H = 22, pad = 2.5;
  const sx = x => x1 === x0 ? W / 2 : pad + (x - x0) / (x1 - x0) * (W - pad * 2);
  const sy = y => y1 === y0 ? H / 2 : H - pad - (y - y0) / (y1 - y0) * (H - pad * 2);
  const d = series.map((p, i) =>
    `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
  const last = series[series.length - 1];
  return `<svg class="spark ${trend}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <path d="${d}"/><circle cx="${sx(last[0]).toFixed(1)}" cy="${sy(last[1]).toFixed(1)}" r="1.9"/>
  </svg>`;
}

const TREND_WORD = {up:"涨", down:"跌", choppy:"震荡", flat:"平"};

function rankColumns(byCity) {
  const cols = [
    {key:"item_name", label:"物品", align:"left", cell: r =>
      `<button class="item jump" data-id="${r.item_id}" title="查这个物品在所有城市的价格">
        <img src="${iconUrl(r.item_id)}" alt="" loading="lazy"
             onerror="this.style.visibility='hidden'">
        <span style="min-width:0"><span class="item-name">${r.item_name}</span>
        <span class="item-id">${r.item_id}</span></span>
      </button>`},
  ];
  if (byCity) cols.push({key:"city", label:"城市", align:"left",
    cell: r => CITY_SHORT[r.city] || r.city});
  cols.push(
    {key:"daily_qty", label:"日均件数",
     cell: r => `<span class="rank-qty">${r.daily_qty.toLocaleString()}</span>`},
    {key:"daily_silver", label:"日均流水",
     cell: r => `<span class="rank-silver">${silver(r.daily_silver)}</span>`},
    {key:"avg_price", label:"均价", cell: r => num(r.avg_price)},
    {key:"price_median", label:"价格区间(最低–最高)", cell: r => {
      const span = r.price_max - r.price_min;
      const mid = span > 0 ? ((r.price_median - r.price_min) / span * 100).toFixed(1) : 50;
      return `<div class="range" title="中位 ${num(r.price_median)}">
        <em>${num(r.price_min)}</em>
        <div class="track"><i class="pin" style="--mid:${mid}%"></i></div>
        <em class="hi">${num(r.price_max)}</em></div>`;
    }},
    {key:"volatility", label:"波动", cell: r =>
      `<span class="vol ${r.volatility >= 60 ? "wild" : r.volatility >= 25 ? "swing" : "calm"}"
       >${r.volatility}%</span>`},
    {key:"trend_pct", label:"趋势", cell: r =>
      `<div class="trend" title="最小二乘拟合:窗口内 ${r.trend_pct > 0 ? "+" : ""}${r.trend_pct}%,
R² ${r.trend_fit}${r.trend === "choppy" ? "(拟合差,方向不可信,就是来回震荡)" : ""}">
        ${sparkline(r.series, r.trend)}
        <em class="${r.trend}">${TREND_WORD[r.trend]} ${r.trend_pct > 0 ? "+" : ""}${
          Math.round(r.trend_pct)}%</em>
      </div>`},
    {key:"days_with_data", label:"天数",
     cell: r => `<span style="color:var(--ink-soft)">${r.days_with_data}</span>`},
  );
  return cols;
}

async function initRank() {
  if (rankState.ready) return;
  rankState.ready = true;
  (lookup.cats?.qualities || []).forEach(q =>
    $("r-quality").add(new Option(q.label, String(q.value))));
  lookup.cats.tree.forEach(c => $("r-cat").add(new Option(`${c.label} (${c.count})`, c.id)));
  $("r-cat").onchange = () => { fillRankSubs(); loadRank(); };
  ["r-window","r-city","r-quality","r-sub"].forEach(id => $(id).onchange = loadRank);
  $("r-pull").onclick = pullHistory;
  await loadRank();
}

function fillRankSubs() {
  const sub = $("r-sub");
  sub.length = 1;
  sub.value = "";
  const node = (lookup.cats?.tree || []).find(c => c.id === $("r-cat").value);
  (node?.subs || []).forEach(s => sub.add(new Option(`${s.label} (${s.count})`, s.id)));
  sub.disabled = !node;
}

function rankParams() {
  return new URLSearchParams({
    window: $("r-window").value,
    city: $("r-city").value,
    quality: $("r-quality").value,
    category: $("r-cat").value,
    subcategory: $("r-sub").value,
    sort: rankState.sort,
    order: rankState.order,
    limit: "60",
  });
}

async function loadRank() {
  const body = $("rank-body");
  body.innerHTML = `<div class="empty"><p>正在统计…</p></div>`;
  const d = await api(`/api/ranking?${rankParams()}`);

  if ($("r-city").options.length <= 1) {
    d.cities.forEach(c => $("r-city").add(new Option(CITY_SHORT[c] || c, c)));
    $("r-city").value = d.city;
  }

  const cov = d.coverage || {};
  $("rank-cov").innerHTML = cov.rows
    ? `库里 <b>${cov.rows.toLocaleString()}</b> 条日线 · <b>${cov.items}</b> 个物品 ·
       <b>${cov.days}</b> 天(${cov.first_day} 至 ${cov.last_day})。
       AODP 只给最近一段,这张表是自己存下来的 —— 跑久了就有上游给不了的长历史。`
    : "库里还没有成交历史。";

  if (!d.rows.length) {
    body.innerHTML = cov.rows
      ? `<div class="empty"><h2>这个范围没有数据</h2>
         <p>换个窗口或分类,或者点右上角把这个分类的历史抓下来。</p></div>`
      : `<div class="empty"><h2>先把历史抓下来</h2>
         <p>销量榜读的是本地库,不是实时 API。选一个分类,点右上角「抓取这个分类的历史」——
            一个分类大约一两次请求、几秒钟。</p></div>`;
    return;
  }

  const byCity = $("r-city").value !== "all";
  const cols = rankColumns(byCity);
  body.innerHTML = `
    <table class="rank-table">
      <thead><tr><th class="rank-no plain">#</th>${cols.map(c => {
        const on = c.key === rankState.sort;
        return `<th data-key="${c.key}" class="${c.align === "left" ? "left" : ""}"
          ${on ? `aria-sort="${rankState.order === "asc" ? "ascending" : "descending"}"` : ""}
          style="${c.align === "left" ? "text-align:left" : ""}"
          >${c.label}${on ? ` <span class="arrow">${rankState.order === "asc" ? "▲" : "▼"}</span>` : ""}</th>`;
      }).join("")}</tr></thead>
      <tbody>${d.rows.map((r, i) => `<tr>
        <td class="rank-no">${i + 1}</td>
        ${cols.map(c => `<td style="${c.align === "left" ? "text-align:left" : ""}">${c.cell(r)}</td>`).join("")}
      </tr>`).join("")}</tbody>
    </table>
    <div class="matrix-note">
      <p><b>日均流水</b> = 日均成交件数 × 成交量加权均价。销量优先的策略下,它比件数更有可比性——
      一天成交 5 千件、单价 3 万的 T8 材料,和一天 15 万件、单价 23 银的 T2 材料,不是一个生意。</p>
      <p><b>价格区间</b>按每行自己的最低–最高归一化,竖线是中位。线偏左说明大部分日子价格在低位,
      偶尔被拉高;偏右则相反。<b>波动</b>是 (最高−最低)/中位:摆得越宽价差机会越多,压货风险也越大。</p>
      <p><b>趋势</b>那条折线是窗口内的日均价走势,百分比来自最小二乘拟合——直接拿首尾两天相减
      很容易被某天的异常均价带偏,回归用上全部点就稳得多。同时看拟合优度 R²:低于 0.3 就判成
      <b>震荡</b>,因为那条斜线本身不可信,涨跌方向没有意义。<b>表头点一下排序,再点一下反向。</b></p>
      <p>口径和扫描页一致:剔掉还没走完的当天,日均的分母是窗口内<b>有数据的天数</b>而不是窗口长度。
      另外 <b>AODP 的 item_count 只统计卖单成交</b>,买单那边拿不到,所以这里的销量是偏低的一侧。</p>
    </div>`;

  body.querySelectorAll("button.jump").forEach(b => b.onclick = () => gotoItem(b.dataset.id));
  body.querySelectorAll("th[data-key]").forEach(th => th.onclick = () => {
    const key = th.dataset.key;
    if (rankState.sort === key) {
      rankState.order = rankState.order === "asc" ? "desc" : "asc";
    } else {
      rankState.sort = key;
      // 名字按笔画从小到大看着顺,数值默认从大到小
      rankState.order = key === "item_name" || key === "city" ? "asc" : "desc";
    }
    loadRank();
  });
}

async function pullHistory() {
  if (rankState.busy) return;
  rankState.busy = true;
  const btn = $("r-pull");
  btn.disabled = true;
  btn.textContent = "抓取中…";
  try {
    const r = await api("/api/history/pull", {
      category: $("r-cat").value,
      subcategory: $("r-sub").value,
      days: 30,
      qualities: [Number($("r-quality").value || 1)],
    });
    $("rank-cov").innerHTML =
      `刚写入 <b>${r.written.toLocaleString()}</b> 条日线(${r.item_count} 个物品,${r.requests} 次 API 请求)。`;
    await loadRank();
  } catch (err) {
    $("rank-cov").innerHTML = `<span style="color:var(--warn)">抓取失败:${err.message}</span>`;
  } finally {
    rankState.busy = false;
    btn.disabled = false;
    btn.textContent = "抓取这个分类的历史";
  }
}

async function routeFromHash() {
  const m = location.hash.match(/^#item\/(.+)$/);
  if (m) {
    const id = decodeURIComponent(m[1]);
    showView("lookup");
    await selectItem(id);
    // 左边列表还空着的话,用这个物品的分类填上,省得还要自己再翻一遍
    if (!lookup.list.length && lookup.data?.item?.category) {
      await loadCategories();
      const it = lookup.data.item;
      lookup.sel = {cat: it.category, sub: it.subcategory || "", fam: it.family || ""};
      $("menu-btn").textContent = menuPath();
      await refreshList();
      renderList();
    }
  } else if (location.hash === "#lookup") showView("lookup");
  else if (location.hash === "#rank") showView("rank");
  else showView("scan");
}
window.addEventListener("hashchange", routeFromHash);

api("/api/state").then(s => {
  if (s.ready) {
    render(s);
    $("max-age").value = String(s.effective.max_age_hours);
    $("capital").value = String(s.effective.capital);
    $("buyfee").checked = s.effective.buy_order_setup_fee;
  } else {
    renderFacts(s.effective);
    $("max-age").value = String(s.effective.max_age_hours);
    $("capital").value = String(s.effective.capital);
    $("buyfee").checked = s.effective.buy_order_setup_fee;
    s.effective.cities.forEach(c => $("city").add(new Option(CITY_SHORT[c] || c, c)));
    $("empty-sub").textContent =
      `拉取 ${s.effective.cities.length} 座城市全部监控物品的当前挂单价和 30 天成交历史,约两次 API 请求。`;
  }
  routeFromHash();
});
</script>
